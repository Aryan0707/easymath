<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0D12">
<meta name="description" content="Learn math from the first step to advanced, with mental-math shortcuts and instant answers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EasyMath">
<title>EasyMath</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav" aria-label="Main">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path class="m" d="M9 16h14" stroke-width="2.4" stroke-linecap="round"/><circle class="d" cx="16" cy="10.4" r="1.9"/><circle class="d" cx="16" cy="21.6" r="1.9"/></svg><span>EasyMath</span></div>
  <button data-tab="learn" class="on"><i data-icon="book"></i><span>Learn</span></button>
  <button data-tab="speed"><i data-icon="stopwatch"></i><span>Speed</span></button>
  <button data-tab="today"><i data-icon="calendar"></i><span>Today</span></button>
  <button data-tab="ask"><i data-icon="equals"></i><span>Answer</span></button>
  <button data-tab="progress"><i data-icon="chart"></i><span>Progress</span></button>
</nav>

<main class="main"><div class="content">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path class="m" d="M9 16h14" stroke-width="2.4" stroke-linecap="round"/><circle class="d" cx="16" cy="10.4" r="1.9"/><circle class="d" cx="16" cy="21.6" r="1.9"/></svg><span>EasyMath</span></div>
    <span class="streak" id="streakChip"></span>
  </header>

  <section id="learn"></section>
  <section id="speed" class="hidden"></section>
  <section id="today" class="hidden"></section>
  <section id="ask" class="hidden">
    <h2 class="page-title">Quick answer</h2>
    <div class="sheet pad">
      <div class="entry" style="margin-top:0">
        <label class="sr" for="askInput">Your question</label>
        <input id="askInput" class="field text" type="text" placeholder="Type a question, such as 15% of 240" autocomplete="off" autocapitalize="off" enterkeyhint="go">
        <button type="button" id="photoBtn" class="btn secondary icon" aria-label="Add a photo of a problem" title="Add a photo of a problem"><i data-icon="camera"></i></button>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      </div>
      <div class="try"><span class="muted">Try</span><div class="chips" id="examples"></div></div>
    </div>
    <div class="sheet pad hidden" id="askOut" aria-live="polite" style="margin-top:14px"></div>
  </section>
  <section id="progress" class="hidden"></section>
</div></main>

<script src="icons.js"></script>
<script src="engine.js"></script>
<script src="skills.js"></script>
<script src="app.js"></script>
</body>
</html>
